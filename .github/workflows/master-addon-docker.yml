name: Build Master Add-On

on:
  push:
    branches:
      - brad/master-addon
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Master Add-On locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/newideasunlimited/aiostreams:master-addon
            ghcr.io/newideasunlimited/aiostreams:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Master QA container
        run: |
          SECRET_KEY="$(printf 'a%.0s' {1..64})"
          docker run -d --name master-qa \
            -p 3000:3000 \
            -e NODE_ENV=development \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e DATABASE_URI=sqlite:///app/data/qa.sqlite \
            ghcr.io/newideasunlimited/aiostreams:master-addon

          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' master-qa 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' master-qa 2>/dev/null || true)" = "false" ]; then docker logs master-qa; exit 1; fi
            sleep 2
          done
          docker logs master-qa
          exit 1

      - name: Full installed Master regression QA
        run: bash scripts/qa-master-installed.sh

      - name: Dump QA logs on failure
        if: failure()
        run: |
          docker logs master-qa 2>&1 || true
          docker logs mediaflow-qa 2>&1 || true

      - name: Stop QA containers
        if: always()
        run: |
          docker rm -f master-qa 2>/dev/null || true
          docker rm -f mediaflow-qa 2>/dev/null || true

      - name: Publish QA-approved Master Add-On
        if: success()
        run: |
          docker push ghcr.io/newideasunlimited/aiostreams:master-addon
          docker push ghcr.io/newideasunlimited/aiostreams:latest
