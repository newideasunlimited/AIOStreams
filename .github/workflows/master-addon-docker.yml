name: Build Master Add-On

on:
  push:
    branches:
      - brad/master-addon
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Master Add-On locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/newideasunlimited/aiostreams:master-addon
            ghcr.io/newideasunlimited/aiostreams:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # QA exercises the production server startup path, but uses development
      # mode so AIOStreams' internal-only builtin middleware permits localhost
      # smoke tests without trying to override the readonly INTERNAL_SECRET.
      - name: Start Master QA container
        run: |
          docker run -d --name master-qa \
            -p 3000:3000 \
            -e NODE_ENV=development \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e DATABASE_URI=sqlite:///app/data/qa.sqlite \
            ghcr.io/newideasunlimited/aiostreams:master-addon

          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' master-qa 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' master-qa 2>/dev/null || true)" = "false" ]; then
              docker logs master-qa
              exit 1
            fi
            sleep 2
          done

          docker logs master-qa
          echo 'Master QA container never became healthy'
          exit 1

      - name: QA Master manifest, catalogs, and playback sources
        run: |
          set -euo pipefail

          CONFIG="$(python3 - <<'PY'
          import base64, json
          raw = json.dumps({
              'services': [],
              'checkOwned': True,
              'autoRemoveDownloads': False,
          }, separators=(',', ':')).encode()
          print(base64.urlsafe_b64encode(raw).decode().rstrip('='))
          PY
          )"

          BASE="http://127.0.0.1:3000/builtins/master-native/$CONFIG"

          encode_id() {
            python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          has_playable_url() {
            jq -e '.streams | type == "array" and any(.url? | type == "string" and length > 0)' "$1" >/dev/null
          }

          curl --fail --silent --show-error "$BASE/manifest.json" -o /tmp/master-manifest.json
          jq -e '.catalogs | any(.id == "master-adult" and .name == "Porn")' /tmp/master-manifest.json
          jq -e '.catalogs | any(.id == "master-live-tv" and .name == "Live TV")' /tmp/master-manifest.json
          jq -e '.catalogs | any(.id == "master-radio" and .name == "Radio")' /tmp/master-manifest.json
          jq -e '.resources | length > 0' /tmp/master-manifest.json

          curl --fail --silent --show-error "$BASE/catalog/tv/master-live-tv.json" -o /tmp/live-tv.json
          jq -e '.metas | type == "array" and length > 0' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-comedy-central")' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-adult-swim")' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-phx-abc15")' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-phx-fox10")' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-phx-12news")' /tmp/live-tv.json
          jq -e '.metas | any(.id == "ustv-priority-phx-azfamily")' /tmp/live-tv.json

          curl --fail --silent --show-error "$BASE/catalog/other/master-radio.json" -o /tmp/radio.json
          jq -e '.metas | type == "array" and length > 0' /tmp/radio.json

          curl --fail --silent --show-error "$BASE/catalog/movie/master-adult.json" -o /tmp/porn.json
          jq -e '.metas | type == "array" and length > 0' /tmp/porn.json

          # Porn cards must represent actual long-form videos. Build the test
          # set only from entries whose advertised runtime is at least 10 min.
          python3 - <<'PY'
          import json

          def seconds(value):
              if not value:
                  return None
              text = str(value).strip()
              parts = text.split(':')
              try:
                  if len(parts) == 2:
                      return int(parts[0]) * 60 + int(parts[1])
                  if len(parts) == 3:
                      return int(parts[0]) * 3600 + int(parts[1]) * 60 + int(parts[2])
                  return round(float(text) * 60)
              except ValueError:
                  return None

          data = json.load(open('/tmp/porn.json'))
          metas = data.get('metas') or []
          bad = [m for m in metas if seconds(m.get('runtime')) is None or seconds(m.get('runtime')) < 600]
          if bad:
              raise SystemExit(f'Porn duration QA failed: {len(bad)} card(s) under/unknown 10 minutes')
          with open('/tmp/porn-ids.txt', 'w') as out:
              for meta in metas[:12]:
                  if meta.get('id'):
                      out.write(meta['id'] + '\n')
          PY

          # Exercise the actual installed Stremio stream route. A passing
          # helper function somewhere else in the tree is not playback QA.
          PORN_OK=0
          while IFS= read -r PORN_ID; do
            [ -n "$PORN_ID" ] || continue
            ENCODED_ID="$(encode_id "$PORN_ID")"
            if curl --fail --silent --show-error "$BASE/stream/movie/$ENCODED_ID.json" -o /tmp/porn-streams.json \
              && has_playable_url /tmp/porn-streams.json; then
              PORN_OK=1
              break
            fi
          done < /tmp/porn-ids.txt
          if [ "$PORN_OK" -ne 1 ]; then
            echo 'No playable long-form Porn URL found in the first 12 current videos.'
            exit 1
          fi

          # The curated live cards are health-filtered by the route itself.
          # Require multiple currently usable feeds, including Phoenix locals.
          LIVE_OK=0
          PHX_OK=0
          for LIVE_ID in \
            ustv-priority-phx-abc15 \
            ustv-priority-phx-fox10 \
            ustv-priority-phx-12news \
            ustv-priority-phx-azfamily \
            ustv-priority-comedy-central \
            ustv-priority-adult-swim; do
            ENCODED_ID="$(encode_id "$LIVE_ID")"
            if curl --fail --silent --show-error "$BASE/stream/tv/$ENCODED_ID.json" -o /tmp/live-streams.json \
              && has_playable_url /tmp/live-streams.json; then
              LIVE_OK=$((LIVE_OK + 1))
              case "$LIVE_ID" in
                ustv-priority-phx-*) PHX_OK=$((PHX_OK + 1)) ;;
              esac
            fi
          done
          if [ "$LIVE_OK" -lt 3 ]; then
            echo "Only $LIVE_OK curated Live TV feeds passed health checks; need at least 3."
            exit 1
          fi
          if [ "$PHX_OK" -lt 2 ]; then
            echo "Only $PHX_OK Phoenix local feeds passed health checks; need at least 2."
            exit 1
          fi

          RADIO_OK=0
          while IFS= read -r RADIO_ID; do
            [ -n "$RADIO_ID" ] || continue
            ENCODED_ID="$(encode_id "$RADIO_ID")"
            if curl --fail --silent --show-error "$BASE/stream/other/$ENCODED_ID.json" -o /tmp/radio-streams.json \
              && has_playable_url /tmp/radio-streams.json; then
              RADIO_OK=1
              break
            fi
          done < <(jq -r '.metas[0:8][]?.id' /tmp/radio.json)
          if [ "$RADIO_OK" -ne 1 ]; then
            echo 'No playable Radio URL found in the first 8 current stations.'
            exit 1
          fi

          echo 'Runtime QA passed: long-form Porn, curated Live TV, Phoenix locals, and Radio expose playable media URLs.'

      - name: Dump QA logs on failure
        if: failure()
        run: docker logs master-qa 2>&1 || true

      - name: Stop QA container
        if: always()
        run: docker rm -f master-qa 2>/dev/null || true

      - name: Publish QA-approved Master Add-On
        if: success()
        run: |
          docker push ghcr.io/newideasunlimited/aiostreams:master-addon
          docker push ghcr.io/newideasunlimited/aiostreams:latest
