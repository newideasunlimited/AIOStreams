services:
  aiostreams:
    image: ghcr.io/newideasunlimited/aiostreams:master-addon
    container_name: master-aiostreams
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - mediaflow

  mediaflow:
    image: mhdzumair/mediaflow-proxy:latest
    container_name: master-mediaflow
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      API_PASSWORD: ${MEDIAFLOW_API_PASSWORD}
      ENABLE_TRANSCODE: "true"
      TRANSCODE_PREFER_GPU: "true"
      TRANSCODE_VIDEO_BITRATE: ${MEDIAFLOW_VIDEO_BITRATE:-4M}
      TRANSCODE_AUDIO_BITRATE: ${MEDIAFLOW_AUDIO_BITRATE:-192000}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
